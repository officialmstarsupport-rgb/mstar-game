<!DOCTYPE html>
<html>
<head>
    <title>M.STAR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            font-family: Arial;
            overflow: hidden; /* no scroll */
        }
        #loginScreen, #loadingScreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: url('images/bg.jpg') no-repeat center/cover; /* we’ll add bg later */
            background-color: black;
        }
        #loadingScreen { display: none; }
        h1 { color: limegreen; font-size: 10vw; text-shadow: 0 0 10px limegreen; }
        p { font-size: 4vw; margin: 10px 0; }
        input { padding: 10px; font-size: 4vw; border-radius: 5px; border: none; text-align: center; }
        button { 
            background: limegreen; 
            color: black; 
            padding: 3vw 6vw; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 5vw;
            box-shadow: 0 0 15px limegreen;
        }
        .soldiers {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5vw;
            width: 100%;
            height: 60%;
            position: absolute;
            bottom: 0;
        }
        .soldiers img {
            width: 45%;
            height: 100%;
            object-fit: cover; /* makes them fill the space like COD */
            filter: brightness(0.8);
        }
        .star { position: absolute; color: limegreen; animation: float 4s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh); opacity: 1; } 100% { transform: translateY(-10vh); opacity: 0; }
        .loading-text { position: absolute; top: 10%; width: 100%; text-align: center; }
    </style>
</head>
<body>

<!-- SCREEN 1: LOGIN -->
<div id="loginScreen">
    <h1>M.STAR</h1>
    <p>Enter to Join the War</p>
    <input type="text" id="username" placeholder="Username"><br>
    <button onclick="startGame()">BECOME A PLAYER</button>
</div>

<!-- SCREEN 2: LOADING FULLSCREEN -->
<div id="loadingScreen">
    <div class="loading-text">
        <h1>Loading...</h1>
        <p>Deploying Squad...</p>
    </div>
    <div class="soldiers">
        <img src="images/soldier1.jpg" alt="">
        <img src="images/soldier2.jpg" alt="">
    </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<script>
    function startGame() {
        let name = document.getElementById('username').value
        document.getElementById('loginScreen').style.display = 'none'
        document.getElementById('loadingScreen').style.display = 'flex'
        document.getElementById('bgMusic').play()
        createStars()
        setTimeout(() => { alert("Welcome " + name + "! M.STAR is Ready!") }, 4000)
    }
    function createStars() {
        setInterval(() => {
            let star = document.createElement('div')
            star.className = 'star'
            star.innerHTML = '✨'
            star.style.left = Math.random() * 100 + '%'
            star.style.fontSize = Math.random() * 15 + 10 + 'px'
            document.body.appendChild(star)
            setTimeout(() => star.remove(), 4000)
        }, 200)
    }
</script>
</body>
</html>
