<!DOCTYPE html>
<html>
<head>
    <title>M.STAR</title>
    <style>
        body { background: black; color: white; text-align: center; font-family: Arial; margin: 0; overflow: hidden; }
        #loginScreen, #loadingScreen { padding-top: 50px; }
        #loadingScreen { display: none; }
        h1 { color: limegreen; }
        button { background: limegreen; color: black; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .soldiers { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .soldiers img { width: 150px; height: 200px; object-fit: cover; border: 3px solid limegreen; border-radius: 10px; }
        .star { position: absolute; color: limegreen; animation: float 4s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh); opacity: 1; } 100% { transform: translateY(-10vh); opacity: 0; }
    </style>
</head>
<body>
<div id="loginScreen">
    <h1>Welcome to M.STAR</h1>
    <p>Enter to Join the War</p>
    <input type="text" id="username" placeholder="Username"><br><br>
    <button onclick="startGame()">BECOME A PLAYER</button>
</div>
<div id="loadingScreen">
    <h1>Loading M.STAR...</h1>
    <div class="soldiers">
        <div style="font-size:80px">🪖</div>
        <img src="images/soldier2.jpg" alt="Boss Vex">
    </div>
    <p>Deploying Squad...</p>
</div>
<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<script>
    function startGame() {
        let name = document.getElementById('username').value
        document.getElementById('loginScreen').style.display = 'none'
        document.getElementById('loadingScreen').style.display = 'block'
        document.getElementById('bgMusic').play()
        createStars()
        setTimeout(() => { alert("Welcome " + name + "! M.STAR is Ready!") }, 4000)
    }
    function createStars() {
        setInterval(() => {
            let star = document.createElement('div')
            star.className = 'star'
            star.innerHTML = '✨'
            star.style.left = Math.random() * 100 + '%'
            star.style.fontSize = Math.random() * 15 + 10 + 'px'
            document.body.appendChild(star)
            setTimeout(() => star.remove(), 4000)
        }, 200)
    }
</script>
</body>
</html>
