<!DOCTYPE html>
<html>
<head>
    <title>M.STAR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, landscape">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        
        /* THIS MAKES IT LANDSCAPE */
        #game {
            width: 100vh; /* swap width and height */
            height: 100vw;
            transform: rotate(90deg);
            transform-origin: 50% 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -50vw;
            margin-left: -50vh;
            background: url('https://i.imgur.com/3QZ8X9P.jpg') no-repeat center/cover;
        }

        /* LOBBY UI LIKE FREE FIRE */
        .topbar {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 1.5vh;
            background: rgba(0,0,0,0.6);
            font-size: 2vh;
            color: white;
        }
        .logo { color: limegreen; font-weight: bold; }
        .coins { color: gold; }

        .center-char {
            position: absolute;
            bottom: 15vh;
            left: 50%;
            transform: translateX(-50%);
            height: 55vh;
        }
        .center-char img { height: 100%; }

        .left-menu {
            position: absolute;
            left: 2vh;
            top: 25vh;
        }
        .btn {
            background: rgba(0,0,0,0.7);
            border: 2px solid limegreen;
            padding: 1.5vh 2vh;
            margin: 1vh 0;
            border-radius: 1vh;
            color: white;
            font-size: 2vh;
            width: 18vh;
        }

        .bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            background: rgba(0,0,0,0.8);
            padding: 1vh;
        }
        .bottom-btn { flex: 1; text-align: center; color: white; font-size: 2vh; padding: 1vh; }
        .start-btn {
            background: gold;
            color: black;
            font-weight: bold;
            font-size: 3vh;
            padding: 2vh 4vh;
            border-radius: 1.5vh;
            border: none;
            box-shadow: 0 0 2vh gold;
        }
    </style>
</head>
<body>

<div id="game">
    <!-- TOP -->
    <div class="topbar">
        <div>MSTAR_Player</div>
        <div class="logo">M.STAR</div>
        <div class="coins">57,180 💰</div>
    </div>

    <!-- LEFT -->
    <div class="left-menu">
        <div class="btn">🛒 STORE</div>
        <div class="btn">🎁 EVENTS</div>
        <div class="btn">💎 LUCK ROYALE</div>
    </div>

    <!-- CENTER -->
    <div class="center-char">
        <img src="images/soldier2.jpg" alt="Boss Vex">
    </div>

    <!-- BOTTOM -->
    <div class="bottom">
        <div class="bottom-btn">VAULT</div>
        <div class="bottom-btn">WEAPON</div>
        <div class="bottom-btn">PRESET</div>
        <div><button class="start-btn">START</button></div>
    </div>
</div>

</body>
</html>
